<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title><%= htmlWebpackPlugin.options.title %></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../styles/style.css">
        <link rel="stylesheet" href="../styles/reset.css">
        <script src="https://kit.fontawesome.com/f7ac979f11.js" crossorigin="anonymous"></script>
    </head>
    <body>
        
        <main>
            <div class="sidebar">
                <div class="logo">
                    <h1>ToDoSth</h1>
                </div>
                <div class="smart_section">
                    <button class="smart_section_item" id="today">Today</button>
                    <button class="smart_section_item" id="upcoming">Upcoming</button>
                    <button class="smart_section_item" id="anytime">Anytime</button>
                    <button class="smart_section_item" id="complited">Complited</button>
                </div>
                <div class="projects_section">
                    <div class="project_section_heading">
                        <h3>Projects</h3>
                    </div>
                    <button class="project_section_item" id="inbox">Inbox</button>
                </div>
            </div>
            <div class="main_section">
                <div class="todo_project_heading">
                    <h1>Inobx</h1>
                    <p>Basic project</p>
                </div>
                <div class="todo_container">
                    <div class="todo_container_item">
                        <div class="todo_container_item_main">
                            <div class="todo_container_item_heading">
                                <input type="checkbox"/>
                                <p>Gain weight :3</p>
                            </div>
                            <div class="todo_container_item_buttons">
                                <div class="todo_date">Due date: <span class="date">29.09.2026</span></div>
                                <div class="todo_priority">Priority: Low</div>
                                <button class="delete_btn">Delete</button>
                                <button class="edit_btn">Edit Todo</button>
                            </div>
                        </div>
                        <div class="todo_container_item_description">
                            <p>You need to gain weight because you will vanish</p>
                        </div>
                    
                    </div>
                </div>
            </div>
        </main>
        
        <form action="" method="post" id="date_form" >

            <label for="title_input">Title:</label>
            <input type="text" name="title" required id="title_input">

            <label for="info_input">Description:</label>
            <input type="text" name="info" required id="info_input">

            <label for="date_input">Due Date:</label>
            <input type="date" name="date" required id="date_input">
            <button type="submit">Send</button>
        </form>

        <div id="error_message"></div>

        <script src="" async defer></script>
        
    </body>
</html>
